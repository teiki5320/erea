<!doctype html><meta charset="utf8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
.b{width:1024px;height:500px;background:#FBF3E0;position:relative;
   display:flex;align-items:center;padding:0 74px;gap:54px}
.frise{position:absolute;left:0;right:0;bottom:0;height:130px;
   background:linear-gradient(180deg,#F3E7CC,#E9DCBC);border-top:3px solid #2A3557}
.crans{position:absolute;left:0;right:0;bottom:0;height:26px;
   background:repeating-linear-gradient(90deg,#2A3557 0 2px,transparent 2px 16px);opacity:.30}
.crans2{position:absolute;left:0;right:0;bottom:0;height:44px;

.txt{position:relative;z-index:2;padding-bottom:104px}
h1{font:800 86px 'Baloo 2',-apple-system,sans-serif;color:#2A3557;line-height:.92;letter-spacing:-1.5px}

</style>
<div class="b">
  <div class="frise"></div><div class="crans"></div><div class="crans2"></div>
  <div class="an" style="left:64px">3000 av. J.-C.</div>
  <div class="an" style="left:320px">an 1000</div>

  <div class="an" style="left:930px">2026</div>
  <div class="aig"></div>
  <img class="ico" src="icone-512.png">
  <div class="txt"><h1>Erea</h1><p>Devine l'année&nbsp;!</p></div>
