name: erea
description: "Erea — devine l'année ! Jeu d'histoire pour toute la famille."
publish_to: "none"
version: 0.1.0+1 # 0.1.0 = CFBundleShortVersionString · 1 = CFBundleVersion

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3 # persistance locale (XP, records, défi du jour)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1 # génère les icônes iOS / Android / web

flutter:
  uses-material-design: true
  assets:
    - assets/events.json
    - assets/img/
  # Polices embarquées (Baloo 2 pour les titres, Nunito pour l'interface).
  # Volontairement en local plutôt que via google_fonts : l'app doit
  # fonctionner hors ligne, sans rien télécharger au premier lancement.
  # Licence SIL OFL : assets/fonts/OFL-*.txt.
  fonts:
    # Baloo 2 n'est utilisée qu'en 700 (thème) et 800 (titres) : le fichier
    # Regular (418 Ko) n'était résolu par aucun style.
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true # l'App Store refuse les icônes avec canal alpha
  web:
    generate: true
