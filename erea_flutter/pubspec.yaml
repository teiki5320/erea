name: erea
description: "Erea — devine l'année ! Jeu d'histoire pour toute la famille."
publish_to: "none"
version: 1.0.0+1 # 1.0.0 = CFBundleShortVersionString · 1 = CFBundleVersion
# Le numéro de build (après le +) est écrasé par Xcode Cloud, qui
# incrémente le sien à chaque compilation — d'où les builds 74 à 78.
# Seul le 1.0.0 compte ici, et il doit être identique au numéro de
# version saisi dans App Store Connect, sinon la soumission est refusée.

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  games_services: ^5.1.0
  in_app_review: ^2.0.9 # demande de note native, au bon moment
  share_plus: ^10.1.4 # feuille de partage iOS pour la grille du défi
  shared_preferences: ^2.2.3 # persistance locale (XP, records, défi du jour)
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1 # génère les icônes iOS / Android / web

flutter:
  uses-material-design: true
  assets:
    - assets/events.json
    - assets/img/
    - assets/sfx/
  # Polices embarquées (Baloo 2 pour les titres, Nunito pour l'interface).
  # Volontairement en local plutôt que via google_fonts : l'app doit
  # fonctionner hors ligne, sans rien télécharger au premier lancement.
  # Licence SIL OFL : assets/fonts/OFL-*.txt.
  fonts:
    # Baloo 2 n'est utilisée qu'en 700 (thème) et 800 (titres) : le fichier
    # Regular (418 Ko) n'était résolu par aucun style.
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true # l'App Store refuse les icônes avec canal alpha
  web:
    generate: true
