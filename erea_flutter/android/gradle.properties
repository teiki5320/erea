org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Réduction optimisée des ressources par R8 (recommandée par la Play
# Console pour la 1.0.5 : mémoire et taille). Sous le plug-in Android
# Gradle 8.11, l'option s'appelle optimizedShrinking ; le nom
# optimizedResourceShrinking des documentations récentes y est ignoré
# sans un mot. Le passage au plug-in 9, l'autre conseil, attend que
# Flutter l'adopte.
android.r8.optimizedShrinking=true
